name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test in pinned PortMaster environment
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/workspace" -w /workspace --entrypoint bash \
            "$(cat toolchain/image.lock)" packaging/build-arm64.sh
      - name: Package muOS and update feed
        env:
          NIGHTFALL_REPOSITORY: ${{ github.repository }}
        run: bash packaging/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-muos
          path: |
            dist/*.zip
            dist/latest-aarch64.txt
            dist/nightfall-*-aarch64
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/latest-aarch64.txt dist/nightfall-*-aarch64 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/latest-aarch64.txt dist/nightfall-*-aarch64 --title "Nightfall Survivors $GITHUB_REF_NAME" --generate-notes
          fi
    permissions:
      contents: write
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2
      - run: make test
